# Camera Configuration — Jetson Orin Nano Super
# Four CSI cameras across two housings.
# sensor_id maps to physical CSI port (0–3).

cameras:

  cam1:
    sensor_id: 0
    role: lpr          # long-range licence-plate recognition
    housing: front
    width: 1920
    height: 1080
    fps: 30
    enabled: true

  cam2:
    sensor_id: 1
    role: wide         # wide-angle vehicle classification
    housing: front
    width: 1920
    height: 1080
    fps: 30
    enabled: true

  cam3:
    sensor_id: 2
    role: lpr
    housing: rear
    width: 1920
    height: 1080
    fps: 30
    enabled: true

  cam4:
    sensor_id: 3
    role: wide
    housing: rear
    width: 1920
    height: 1080
    fps: 30
    enabled: true
