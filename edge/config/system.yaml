# Seen-It-First-Edge System Configuration
# NVIDIA Jetson Orin Nano Super - Phase 1
#
# MODEL STRATEGY (Phase 1):
#   All models are PRETRAINED. No custom training or fine-tuning required.
#   - YOLOv8n:     COCO pretrained (vehicle detection)
#   - YOLOv8n-LP:  Pretrained US-plate detection model
#   - PP-OCRv4:    PaddleOCR English recognition model
#   - YOLOv8n-cls: ImageNet pretrained (vehicle classification)
#   Custom fine-tuning pipelines are deferred to Phase 3.
#
# SCOPE: US plates only. No EU/International support.

system:
  device: "jetson-orin-nano-super"
  log_level: "INFO"
  log_dir: "logs"
  database_path: "data/seen_it_first.db"

cameras:
  max_cameras: 4
  ingest_fps: 30
  frame_width: 1920
  frame_height: 1080
  queue_size: 8  # bounded frame queue per camera
  protocol: "rtsp"  # rtsp or csi

inference:
  # Max 2 concurrent inference workers (GPU memory constraint)
  max_concurrent_workers: 2
  # Frame skipping enabled (drop oldest on queue overflow)
  frame_skip_enabled: true

  vehicle_detection:
    model_path: "models/vehicle/vehicle.engine"  # YOLOv8n COCO pretrained
    input_size: 640
    confidence_threshold: 0.45
    nms_threshold: 0.5
    max_fps: 15
    precision: "fp16"
    pretrained: true  # COCO pretrained, no custom training needed
    # Budget: ~45 MB VRAM
    # DO NOT upgrade to YOLOv8s/m/l - GPU budget locked

  plate_detection:
    model_path: "models/plate/plate.engine"  # YOLOv8n-LP US-plate pretrained
    input_size: 640
    confidence_threshold: 0.50
    nms_threshold: 0.4
    precision: "fp16"
    pretrained: true  # Pretrained US-plate model, no fine-tuning needed
    scope: "us_only"  # No EU/International support in Phase 1
    # Budget: ~90 MB VRAM
    # DO NOT upgrade to YOLOv8m/l - GPU budget locked

  ocr:
    model_path: "models/ocr/ocr.engine"  # PaddleOCR PP-OCRv4 English rec
    input_width: 320    # PP-OCRv4 rec: W=320 (fixed for plate crops)
    input_height: 48    # PP-OCRv4 rec: H=48
    confidence_threshold: 0.60
    min_plate_chars: 2
    max_plate_chars: 8
    precision: "fp16"
    pretrained: true  # Pretrained PP-OCRv4, no custom training needed
    charset: "A-Z0-9"  # Post-processing validates US plates only
    validation_regex: "^[A-Z0-9]{2,8}$"
    # Budget: ~30 MB VRAM

  classifier:
    model_path: "models/classifier/classifier.engine"  # YOLOv8n-cls ImageNet
    input_size: 224
    precision: "fp16"
    pretrained: true  # ImageNet pretrained YOLOv8n-cls, no custom training needed
    # Budget: ~15 MB VRAM

  tracker:
    max_age: 30          # frames before track deletion
    min_hits: 3          # detections before track confirmed
    iou_threshold: 0.3
    max_cosine_distance: 0.4
    embedding_dim: 128

  # Total GPU memory budget: ~200 MB models + ~300 MB runtime = ~500 MB
  # Jetson Orin Nano Super shared memory: 8 GB
  # Target: < 75% GPU utilization

scheduling:
  vehicle_detection_fps: 15
  tracking_fps: 15
  frame_skip_strategy: "drop_oldest"

thermal:
  poll_interval_sec: 5
  threshold_1: 80  # °C - reduce to 10 FPS
  threshold_2: 90  # °C - reduce to 8 FPS, suspend classifier
  cooldown_fps_1: 10
  cooldown_fps_2: 8
  zone_path: "/sys/devices/virtual/thermal/thermal_zone0/temp"

evidence_selection:
  # Cross-camera arbitration weights for choosing the best plate evidence frame
  weight_ocr: 0.45
  weight_plate_area: 0.20
  weight_sharpness: 0.20
  weight_exposure: 0.10
  night_bonus: 0.05

night_vision:
  brightness_threshold: 60  # histogram mean below this = night mode
  clahe_clip_limit: 3.0
  clahe_grid_size: 8
  gamma: 0.7

hotlist:
  file_path: "data/hotlist.csv"
  cooldown_sec: 60
  audio_alert: true
  beep_frequency: 1000
  beep_duration_ms: 500

storage:
  max_detections: 1000000
  vacuum_interval_hours: 24
  snapshot_dir: "data/snapshots"

navigation:
  # Arrival geofence radius — pipeline activates when vehicle is this close
  arrival_radius_m: 80
  # OpenStreetMap Nominatim geocoder (replace with self-hosted for production)
  nominatim_url: "https://nominatim.openstreetmap.org"
  # OSRM routing (replace with self-hosted for production)
  osrm_url: "https://router.project-osrm.org"
  # Local disk cache for geocode results
  geocode_cache_path: "data/geocode_cache.json"

api:
  host: "127.0.0.1"
  port: 8080
  # Optional shared secret for /navigation/* and /ws (empty disables auth)
  auth_token: ""
  # Restrict browser origins for dashboard/API calls
  allowed_origins:
    - "http://localhost:5173"
