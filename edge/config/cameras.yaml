# SEEN IT FIRST - Camera Configuration
# 4x Sony IMX cameras across 2 housings (A and B)
# Each housing: 1x IMX462 LPR camera + 1x IMX327 wide-angle camera
# Target platform: NVIDIA Jetson Orin Nano Super

cameras:
  - id: cam_a_lpr
    housing: A
    sensor: IMX462
    source_type: csi
    source: 0
    width: 1920
    height: 1080
    fps: 30
    role: lpr
    ir_led_gpio_pin: 12
    ir_cut_gpio_pin: 13

  - id: cam_a_wide
    housing: A
    sensor: IMX327
    source_type: csi
    source: 1
    width: 1920
    height: 1080
    fps: 30
    role: wide
    ir_led_gpio_pin: 16
    ir_cut_gpio_pin: 17

  - id: cam_b_lpr
    housing: B
    sensor: IMX462
    source_type: csi
    source: 2
    width: 1920
    height: 1080
    fps: 30
    role: lpr
    ir_led_gpio_pin: 20
    ir_cut_gpio_pin: 21

  - id: cam_b_wide
    housing: B
    sensor: IMX327
    source_type: csi
    source: 3
    width: 1920
    height: 1080
    fps: 30
    role: wide
    ir_led_gpio_pin: 24
    ir_cut_gpio_pin: 25
