# Minimal stack for integration tests (no GPU, no camera, no monitoring)
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: reposcan_test
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: reposcan_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reposcan_test"]
      interval: 5s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: reposcan_test
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: reposcan_test
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SECRET_KEY: test-secret-key-not-for-production
      DEBUG: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
