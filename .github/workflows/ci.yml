name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-lint-test:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx eslint .
      - run: npx vitest run
      - run: npx tsc --noEmit

  backend-lint-test:
    name: Backend Lint & Test
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-key-not-for-production
      POSTGRES_PASSWORD: ci-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Lint Python (backend, ai, camera)
        run: ruff check --config ruff.toml backend/ ai/ camera/
      - name: Check formatting (backend, ai, camera)
        run: ruff format --check --config ruff.toml backend/ ai/ camera/
      - name: Run backend tests
        working-directory: backend
        run: pytest tests/ -v

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [frontend-lint-test, backend-lint-test]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build frontend backend
