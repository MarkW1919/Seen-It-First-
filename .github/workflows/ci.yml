name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-lint-test:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx eslint .
      - run: npx vitest run
      - run: npx tsc --noEmit

  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.8.4
      - name: Lint Python (backend, ai, camera)
        run: ruff check backend/ ai/ camera/
      - name: Check formatting (backend, ai, camera)
        run: ruff format --check backend/ ai/ camera/

  backend-test:
    name: Backend Test
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-key-not-for-production
      POSTGRES_PASSWORD: ci-test-password
      POSTGRES_HOST: localhost
      POSTGRES_USER: reposcan
      POSTGRES_DB: reposcan
      REDIS_HOST: localhost
      POSTGRES_SSLMODE: disable
    services:
      postgres:
        image: postgis/postgis:15-3.4
        env:
          POSTGRES_USER: reposcan
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: reposcan
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Run backend tests
        working-directory: backend
        run: pytest tests/ -v

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [frontend-lint-test, backend-lint, backend-test]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build frontend backend
