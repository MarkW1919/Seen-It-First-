# SEEN IT FIRST — Development Docker Compose
# Production deployment uses systemd (see deployment/systemd/)
# This file is for development and testing ONLY.

services:
  edge:
    build:
      context: .
      dockerfile: deployment/docker/edge.Dockerfile
    container_name: sif-edge
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - SIF_CONFIG_DIR=/app/edge/config
      - SIF_DATA_DIR=/data
      - SIF_LOG_LEVEL=DEBUG
    volumes:
      - ./edge:/app/edge
      - model-data:/app/edge/models
      - sif-data:/data
    devices:
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
      - /dev/video2:/dev/video2
      - /dev/video3:/dev/video3
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/system/status"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build:
      context: .
      dockerfile: deployment/docker/api.Dockerfile
    container_name: sif-api
    environment:
      - SIF_DB_PATH=/data/seen_it_first.db
      - SIF_LOG_LEVEL=DEBUG
    volumes:
      - ./edge:/app/edge
      - sif-data:/data
    ports:
      - "8001:8000"
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: deployment/docker/dashboard.Dockerfile
    container_name: sif-dashboard
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  model-data:
    driver: local
  sif-data:
    driver: local
